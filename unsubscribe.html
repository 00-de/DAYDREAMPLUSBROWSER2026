<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配信停止 — DayDream➕</title>
<style>
:root{
  --accent:#5b8cff; --accent2:#a06bff;
  --text:#1e2436; --muted:#8b93a7; --line:#e3e6ee;
}
*{box-sizing:border-box;}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
  background:
    radial-gradient(800px 500px at 10% -10%, #dfe6ff 0%, transparent 60%),
    radial-gradient(700px 500px at 100% 0%, #ecdfff 0%, transparent 55%),
    #f4f6fb;
  color:var(--text);
}
.box{
  width:min(460px,100%);background:#fff;border-radius:18px;
  box-shadow:0 4px 30px rgba(20,26,43,.1);overflow:hidden;
}
.head{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;padding:22px 26px;font-size:18px;font-weight:800;letter-spacing:1px;
}
.head small{display:block;font-size:11px;font-weight:500;opacity:.85;margin-top:3px;letter-spacing:.5px;}
.inner{padding:26px;}
h1{font-size:16px;margin:0 0 10px;}
p{font-size:13px;line-height:1.9;color:var(--muted);margin:0 0 18px;}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;letter-spacing:.5px;}
input{
  width:100%;padding:11px 13px;font-size:14px;font-family:inherit;
  border:1px solid var(--line);border-radius:10px;outline:none;color:var(--text);
}
input:focus{border-color:var(--accent);}
button{
  width:100%;margin-top:16px;padding:12px;border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
  box-shadow:0 4px 14px rgba(91,140,255,.3);transition:.15s;
}
button:hover{filter:brightness(1.08);}
button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}
.msg{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:12.5px;line-height:1.8;display:none;}
.msg.ok{display:block;background:#e7f8f0;color:#1a7a55;border:1px solid #b6e6d1;}
.msg.ng{display:block;background:#fdeaec;color:#a8323d;border:1px solid #f5c2c8;}
.foot{padding:14px 26px;background:#f8f9fd;font-size:11px;color:var(--muted);border-top:1px solid var(--line);}
</style>
</head>
<body>

<div class="box">
  <div class="head">DayDream&#10133;<small>MAIL DELIVERY SETTINGS</small></div>

  <div class="inner">
    <h1>メール配信の停止</h1>
    <p>
      配信を停止したいメールアドレスを入力してください。<br>
      手続き後は、DayDream➕ からのお知らせメールが届かなくなります。
    </p>

    <label>メールアドレス</label>
    <input type="email" id="email" placeholder="example@mail.com" autocomplete="email">

    <button id="btn">配信を停止する</button>

    <div class="msg" id="msg"></div>
  </div>

  <div class="foot">DayDream&#10133; ／ お問い合わせはメールへの返信にてお願いいたします。</div>
</div>

<script>
/* ============================================================
   配信停止の受付
   ------------------------------------------------------------
   ここでは受付内容をメールで通知する方式にしています。
   Firebase の設定が不要で、すぐに使えます。
   ============================================================ */

// URL に ?email=... が付いていたら自動で入力します
const params = new URLSearchParams(location.search);
if (params.get('email')) {
  document.getElementById('email').value = params.get('email');
}

document.getElementById('btn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim().toLowerCase();
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');

  msg.className = 'msg';

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    msg.className = 'msg ng';
    msg.textContent = 'メールアドレスの形式が正しくありません。';
    return;
  }

  btn.disabled = true;
  btn.textContent = '処理中…';

  try {
    const res = await fetch('/api/unsubscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });

    if (!res.ok) throw new Error('受付に失敗しました');

    msg.className = 'msg ok';
    msg.innerHTML = '配信停止の手続きを受け付けました。<br>これまでのご愛顧、ありがとうございました。';
    btn.textContent = '完了しました';
  } catch (e) {
    msg.className = 'msg ng';
    msg.textContent = '処理に失敗しました。時間をおいて再度お試しください。';
    btn.disabled = false;
    btn.textContent = '配信を停止する';
  }
});
</script>

</body>
</html>
